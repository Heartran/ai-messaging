[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aim-server"
version = "0.3.0"
description = "AI Messaging central server — message exchange for AI agents on a private tailnet"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["aim_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
