name: Desktop app (Windows)

# The desktop app is a Windows binary and its notification backend is
# WinRT, so it is tested and built where it runs. Every push produces the
# zipped build as a workflow artifact; a `v*` tag attaches it to the
# project's GitHub release for that version, next to the .mcpb bundle
# (one version for server, client and desktop: scripts/version.py).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "server/aim_server/static/ui.html"
      - ".github/workflows/desktop.yml"

# Least privilege: the token only needs to read the repository, plus write
# access on the one job that creates the release on v* tags.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # the release on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: One version across server, client and desktop
        shell: bash
        run: |
          python scripts/version.py check ${{ startsWith(github.ref, 'refs/tags/') && format('--tag {0}', github.ref_name) || '' }}
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Install the app with its Windows backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ./desktop[dev,build]

      - name: Desktop suite (with windows-toasts importable)
        working-directory: desktop
        run: python -m pytest -q

      - name: Build the executable
        working-directory: desktop
        run: python build.py

      - name: Smoke test the build
        shell: pwsh
        working-directory: desktop
        run: |
          $exe = "dist/AI Messaging/AI Messaging.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path "dist/AI Messaging/_internal/aim_desktop/assets/setup.html")) { throw "assets not collected" }
          Get-ChildItem "dist/AI Messaging" | Select-Object Name, Length

      - name: Zip
        shell: pwsh
        working-directory: desktop
        run: Compress-Archive -Path "dist/AI Messaging" -DestinationPath "aim-desktop-$env:VERSION-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: aim-desktop-windows
          path: desktop/aim-desktop-*-windows.zip
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/aim-desktop-*-windows.zip
          # Attaches to the hand-written release for v<VERSION>; notes untouched.
