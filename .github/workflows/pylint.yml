name: Pylint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages and pylint
        run: |
          python -m pip install --upgrade pip
          pip install -e ./server[dev] -e ./mcp[dev] pylint

      - name: Analyse the code with pylint
        run: pylint --fail-under=10 server/aim_server mcp/aim_mcp server/tests mcp/tests
