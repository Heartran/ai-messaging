[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aim-mcp"
version = "0.4.1"
description = "AI Messaging MCP client — connects an AI agent to the central messaging server on a private tailnet"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.scripts]
aim-mcp = "aim_mcp.__main__:run"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["aim_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p anyio"
